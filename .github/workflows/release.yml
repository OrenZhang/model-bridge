name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0-alpha.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version)throw new Error("Release tag must match package.json version")'
      - run: npm ci
      - run: npm run check
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - name: Bundle verified official Mihomo core
        run: node scripts/prepare-mihomo.mjs
      - name: Verify AI node selection with real Mihomo
        run: node scripts/validate-ai-proxy.mjs
      - name: Verify macOS idle sleep prevention
        if: runner.os == 'macOS'
        run: npx electron scripts/validate-power-save.cjs
      - name: Verify Codex integration
        run: node scripts/validate-codex-providers.mjs --mock-pools
      - name: Build installers and update metadata
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 xvfb libsecret-1-0 libgtk-3-0 libnss3 libgbm1
          dbus-run-session -- bash -c '
            export XDG_CURRENT_DESKTOP=GNOME
            printf "ci-fixture-password" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/validate-linux-desktop.mjs
          '
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
      - name: Merge architecture metadata and verify assets
        run: node scripts/merge-release-updates.mjs release-artifacts release-upload
      - name: Create checksums
        working-directory: release-upload
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Model Bridge $RELEASE_TAG" --notes-file docs/releases/current.md "${args[@]}"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo 'This version is already published. Create a new version instead of replacing published assets.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-upload/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
